# OpenTelemetry Collector: receives OTLP from the API and the browser,
# batches it, and forwards traces to Jaeger (swap the exporter for your
# vendor in production — Grafana Tempo, Honeycomb, Datadog, etc.).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://localhost:3000
            - http://127.0.0.1:3000
          allowed_headers: ["*"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  batch:
    timeout: 2s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic
  debug/logs:
    verbosity: normal
  # Local log store: JSON lines, rotated (20 MB x 3 backups). In production,
  # replace with your vendor's exporter (Grafana Cloud/Loki, Datadog, etc.).
  file/logs:
    path: /var/log/otel/edu-logs.jsonl
    rotation:
      max_megabytes: 20
      max_backups: 3

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/logs, debug/logs]
